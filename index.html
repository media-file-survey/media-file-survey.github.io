<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media File Management Survey</title>
<script>
/* ============================================================
   FILL THESE IN BEFORE UPLOADING
   ============================================================ */
const CONFIG = {
  researcherName: "Emmy",   // Your name
  researcherEmail: "emyliu7@gmail.com",  // Email for respondents' questions
  formEndpoint: "https://formspree.io/f/mzeeqbey",     // Where answers are sent
  currency: "$"         // Currency symbol used in Q21
};
</script>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f6f2; --surface: #ffffff; --text: #1d2023; --muted: #666c72;
  --line: #e3e2dc; --line-strong: #c4c4bc; --accent: #17565a; --accent-text: #ffffff; --soft: #eaf2f1;
  --error: #b3261e; --warn-bg: #fbf3dc; --warn-text: #5c4600;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --surface: #1c2024; --text: #eceded; --muted: #a2a8ae;
    --line: #2f353a; --line-strong: #4b5359; --accent: #7fcbc6; --accent-text: #0e2425; --soft: #1e2f30;
    --error: #ff9c94; --warn-bg: #352c14; --warn-text: #efdba4;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 680px; margin: 0 auto; padding: 48px 16px 80px; }
.eyebrow {
  margin: 0 0 6px; color: var(--accent); font-size: .78rem; font-weight: 600;
  letter-spacing: .09em; text-transform: uppercase;
}
h1 { font: 500 2.1rem/1.15 var(--serif); letter-spacing: -.01em; margin: 0 0 28px; }
h2 { font: 500 1.45rem/1.25 var(--serif); margin: 0 0 8px; }
h2:focus { outline: none; }
a { color: var(--accent); text-underline-offset: 2px; }
.setup {
  background: var(--warn-bg); color: var(--warn-text);
  padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: .86rem;
}
.progress {
  display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.bar { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 36px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(20, 24, 28, .04), 0 8px 24px rgba(20, 24, 28, .04);
}
.card > h2 { margin-bottom: 20px; }
.card > .hint { margin-top: -12px; margin-bottom: 20px; }
.intro { margin-bottom: 28px; }
.intro p, .intro ul { margin: 0 0 12px; }
.intro ul { padding-left: 20px; }
.intro li { margin-bottom: 6px; }
fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 26px 0 28px; min-width: 0; }
.card > fieldset:last-child { padding-bottom: 0; }
legend { float: left; width: 100%; font-weight: 600; line-height: 1.4; padding: 0; margin-bottom: 12px; }
legend + * { clear: both; }
.qnum { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 6px; }
.req { color: var(--muted); font-size: .8rem; font-weight: 500; margin-left: 6px; }
.hint { color: var(--muted); font-size: .86rem; margin: -6px 0 12px; }
.option {
  display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  transition: border-color .12s ease, background-color .12s ease;
}
.option:hover { border-color: var(--line-strong); }
.option:has(input:checked) { border-color: var(--accent); background: var(--soft); }
.option:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.option input { width: 17px; height: 17px; margin: 3px 0 0; flex: none; accent-color: var(--accent); }
input[type=text], textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 9px; padding: 10px 14px;
}
textarea { min-height: 120px; resize: vertical; display: block; }
.other-text { margin: 0 0 8px; }
input[aria-invalid="true"] { border-color: var(--error); }
.details { margin-top: 12px; padding: 18px; background: var(--soft); border-radius: 9px; }
.details-note { margin: 0 0 16px; font-size: .9rem; }
.details-field { margin-top: 14px; }
.details-label { display: block; font-weight: 600; margin-bottom: 6px; }
.grid-row { padding: 14px 0; border-top: 1px solid var(--line); }
.grid-row:first-of-type { border-top: 0; padding-top: 2px; }
.grid-row:last-of-type { padding-bottom: 0; }
.grid-row .row-label { margin-bottom: 8px; display: block; }
.pills { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.pill { position: relative; display: flex; margin-left: -1px; }
.pill:first-child { margin-left: 0; }
.pill input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pill span {
  flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 7px 6px; border: 1px solid var(--line-strong); cursor: pointer;
  font-size: .8rem; line-height: 1.25; transition: background-color .12s ease;
}
.pill:first-child span { border-radius: 8px 0 0 8px; }
.pill:last-child span { border-radius: 0 8px 8px 0; }
.pill span:hover { background: var(--soft); }
.pill input:checked + span {
  position: relative; z-index: 1; font-weight: 600;
  background: var(--accent); border-color: var(--accent); color: var(--accent-text);
}
.pill input:focus-visible + span { position: relative; z-index: 2; outline: 2px solid var(--accent); outline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error { color: var(--error); font-size: .88rem; margin: 6px 0 0; font-weight: 500; }
#submit-error { margin: 0 0 12px; }
.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
button {
  font: inherit; font-weight: 600; padding: 10px 26px; border-radius: 9px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer;
  transition: opacity .12s ease;
}
button:hover { opacity: .9; }
button.secondary { background: transparent; border-color: transparent; color: var(--muted); padding: 10px 12px; }
button.secondary:hover { color: var(--text); opacity: 1; }
button:disabled { opacity: .6; cursor: default; }
#end:focus { outline: none; }
#end p { margin: 0 0 12px; }
#end p:last-child { margin-bottom: 0; }
.trap { position: absolute; left: -9999px; }
[hidden] { display: none !important; }
@media (max-width: 560px) {
  main { padding-top: 28px; padding-bottom: 56px; }
  h1 { font-size: 1.7rem; margin-bottom: 20px; }
  .card { padding: 22px 18px; border-radius: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill, .pill:first-child { margin-left: 0; }
  .pill span, .pill:first-child span, .pill:last-child span { border-radius: 999px; padding: 7px 13px; font-size: .84rem; }
}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Research survey</p>
  <h1>Media File Management Survey</h1>
  <div id="setup" class="setup" hidden></div>
  <div id="progress" class="progress" aria-live="polite"></div>
  <form id="form" novalidate></form>
  <div id="end" class="card" hidden tabindex="-1"></div>
</main>

<script>
const C = CONFIG.currency;
const OTHER = "Other";
const FREQ = ["Not important", "Slightly important", "Moderately important", "Very important", "Essential"];

const SECTIONS = [
  { title: "Introduction and consent", intro: true, questions: [
    { id: "Q1", text: "Do you agree to take part?", type: "one", required: true, endOn: "No",
      options: ["Yes, I am 18 or older and I agree to take part", "No"] }
  ]},
  { title: "Section A: About you", questions: [
    { id: "Q2", text: "Do you personally copy, name, sort or look after media files as part of your work or projects?", type: "one", required: true, endOn: "No",
      options: ["Yes, regularly", "Yes, occasionally", "No"] },
    { id: "Q3", text: "Which best describes your main role?", type: "one", required: true,
      options: ["Assistant editor", "Editor", "DIT or data wrangler", "Post-production coordinator or supervisor", "Independent filmmaker or documentary maker", "Freelance videographer", "Online content creator", "Student", OTHER] },
    { id: "Q4", text: "How many years have you worked with media files?", type: "one",
      options: ["Less than 1", "1 to 3", "4 to 9", "10 or more"] },
    { id: "Q5", text: "What kind of projects do you mostly work on?", type: "many", max: 2, hint: "Choose up to two",
      options: ["Feature films or scripted drama", "Television or streaming series", "Documentary", "Commercials or corporate video", "Weddings or events", "YouTube, TikTok or other online content", OTHER] },
    { id: "Q6", text: "How many people usually share responsibility for the files on your projects?", type: "one",
      options: ["Just me", "2 to 5", "6 to 20", "More than 20"] }
  ]},
  { title: "Section B: How you work now", note: "Think about a typical recent project when answering.", questions: [
    { id: "Q7", text: "Roughly how many media files does a typical project produce?", type: "one",
      options: ["Fewer than 100", "100 to 499", "500 to 1,999", "2,000 or more", "Not sure"] },
    { id: "Q8", text: "How many cameras or recorders usually feed into one project?", type: "one",
      options: ["1", "2 to 3", "4 or more"] },
    { id: "Q9", text: "Where do you keep files while working on them?", type: "many", hint: "Choose all that apply",
      options: ["Computer's internal drive", "External drives", "Shared network storage (NAS or SAN)", "Cloud storage", OTHER] },
    { id: "Q10", text: "Which tools do you use to copy, name or organise files?", type: "many", hint: "Choose all that apply",
      options: ["Windows Explorer or macOS Finder, by hand", "Editing software (Premiere Pro, DaVinci Resolve, Final Cut Pro, Avid)", "Offload or backup software (ShotPut Pro, Silverstack, OffShoot)", "Batch renaming software", "Spreadsheets or written logs", "Custom scripts", OTHER] },
    { id: "Q11", text: "What usually happens to the original camera filenames?", type: "one",
      options: ["I keep them, and add any labels only inside my editing software", "I keep the originals and rename copies", "I rename the original files", "It depends on the project", "Someone else decides", "Not sure"] },
    { id: "Q12", text: "Where do your naming and folder rules usually come from?", type: "one",
      options: ["My own system", "My company or production", "Each client or project sets its own", "There are no consistent rules", OTHER] }
  ]},
  { title: "Section C: What causes problems", questions: [
    { id: "Q13", text: "On a typical project, how long do you personally spend copying, naming and organising files?", type: "one",
      options: ["Less than 30 minutes", "30 minutes to 2 hours", "2 to 5 hours", "5 to 10 hours", "More than 10 hours", "Not sure"] },
    { id: "Q14", text: "How much of a burden is each task for you?", type: "grid",
      columns: ["Not a burden", "Minor", "Moderate", "Major", "Don't do this"],
      rows: ["Copying files and checking they copied correctly", "Renaming files", "Creating and keeping folder structures", "Matching audio to video", "Identifying the scene and take in each clip", "Finding a specific clip later", "Finding duplicate files", "Handing files to another person or team", "Archiving finished projects"] },
    { id: "Q15", text: "If one of those tasks could disappear tomorrow, which would you choose?", type: "one",
      options: ["Copying and checking files", "Renaming files", "Creating and keeping folder structures", "Matching audio to video", "Identifying scenes and takes", "Finding specific clips", "Finding duplicates", "Handing files over", "Archiving", "None of these"] },
    { id: "Q16", text: "In the past 12 months, how often has each of these happened to you?", type: "grid",
      columns: ["Never", "Once or twice", "Several times", "Monthly or more"],
      rows: ["Couldn't find a file I needed", "Files had wrong or inconsistent names", "Links broke in an editing project after files moved or were renamed", "Wasted storage or confusion from duplicate files", "Received badly organised files from someone else", "A file was lost or corrupted"] },
    { id: "Q17", text: "Describe the last time a file problem cost you time. What happened, and how did you fix it?", type: "text", hint: "Optional. No confidential details, please." }
  ]},
  { title: "Section D: Existing tools and cost", questions: [
    { id: "Q18", text: "In the past two years, has anyone paid for software mainly to copy, name or organise your media files?", type: "one",
      options: ["Yes, I paid", "Yes, my employer or client paid", "No, I only use free or included tools", "No, I don't use any such tool", "Not sure"] },
    { id: "Q19", text: "How well do your current tools handle file organisation?", type: "one",
      options: ["Very poorly", "Poorly", "Acceptably", "Well", "Very well"] },
    { id: "Q20", text: "What is the biggest thing your current tools don't do well?", type: "text", hint: "Optional" },
    { id: "Q21", text: "Suppose a tool saved you several hours on a typical project. What is the most you would realistically pay per month?", type: "one",
      options: ["Nothing", `Up to ${C}5`, `${C}6 to ${C}10`, `${C}11 to ${C}20`, `${C}21 to ${C}50`, `More than ${C}50`, "My employer would decide"] },
    { id: "Q22", text: "How would you prefer to pay for a tool like this?", type: "one",
      options: ["One-time purchase", "Monthly or yearly subscription", "Per project", "I would only use a free tool", "No preference"] }
  ]},
  { title: "Section E: Automation, AI and trust", questions: [
    { id: "Q23", text: "How much would you let software do each of these?", type: "grid",
      columns: ["Do it automatically", "Suggest, and I approve", "I wouldn't use this"],
      rows: ["Read the date, camera and other details stored in files", "Suggest file names", "Rename copies of files", "Rename original camera files", "Sort files into folders", "Read slates in footage to identify scene and take", "Use AI on my own computer to describe footage", "Use AI in the cloud to describe footage"] },
    { id: "Q24", text: "Are you allowed to upload footage to outside online services for processing?", type: "one",
      options: ["Yes, usually", "It depends on the project or client", "No, usually not", "Not sure"] },
    { id: "Q25", text: "How important is it that a tool like this works without an internet connection?", type: "one", options: FREQ },
    { id: "Q26", text: "Would a feature's energy use or environmental impact affect whether you use it?", type: "one",
      options: ["Not at all", "A little", "Moderately", "A lot", "Not sure"] },
    { id: "Q27", text: "How much do you agree with each statement about automating file organisation?", type: "grid",
      columns: ["Strongly disagree", "Disagree", "Neutral", "Agree", "Strongly agree"],
      rows: ["It would free up time for more skilled or creative work", "It would reduce paid work for people in my field", "It would make it harder for newcomers to learn the craft", "I would still want to check the results myself"] }
  ]},
  { title: "Closing", questions: [
    { id: "Q28", text: "Is there anything else about managing media files that I should know?", type: "text", hint: "Optional" },
    { id: "Q29", text: "Would you be open to a 20-minute interview about how you work?", type: "one", hint: "Optional",
      options: ["Yes", "No, thanks"],
      details: {
        showOn: "Yes",
        note: "Your details will be stored with your survey answers, so I'll know which answers are yours. I'll only use them to arrange the interview and for this research.",
        fields: [
          { name: "Q29a", label: "Your name", required: true, autocomplete: "name", error: "Please enter your name." },
          { name: "Q29b", label: "Best email or phone number", required: true, error: "Please enter an email or phone number." },
          { name: "Q29c", label: "What is your main role?", autocomplete: "organization-title" }
        ]
      } }
  ]}
];

const form = document.getElementById("form");
const endBox = document.getElementById("end");
const progress = document.getElementById("progress");
let page = 0;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") n.className = attrs[k];
    else if (k in n && k !== "list") n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(c => n.append(c));
  return n;
}

function contactLine() {
  const name = CONFIG.researcherName || "[your name]";
  const p = el("p", {}, `Questions? Contact ${name} at `);
  if (CONFIG.researcherEmail) p.append(el("a", { href: "mailto:" + CONFIG.researcherEmail }, CONFIG.researcherEmail));
  else p.append("[your email]");
  p.append(".");
  return p;
}

function introBlock() {
  return el("div", { class: "intro" },
    el("p", {}, "Thanks for taking part. This survey takes about 10 minutes and asks how you organise video, audio and other media files after a shoot."),
    el("p", {}, "The answers will help me research whether software could make this work easier, and where it should not interfere."),
    el("ul", {},
      el("li", {}, "This survey only asks for your name and contact details if you offer to do an interview."),
      el("li", {}, "The survey runs on GitHub and your answers are stored with Formspree. You can read their privacy policies here: ",
        el("a", { href: "https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement", target: "_blank", rel: "noopener" }, "GitHub"),
        " and ",
        el("a", { href: "https://formspree.io/legal/privacy-policy/", target: "_blank", rel: "noopener" }, "Formspree"),
        "."),
      el("li", {}, "Taking part is voluntary. You can skip any question that isn't marked required, or stop at any time."),
      el("li", {}, "Please don't include client names, project titles or other confidential details."),
      el("li", {}, "Your answers will only be used for this research project.")),
    contactLine());
}

function optionRow(q, value, type) {
  const input = el("input", { type: type === "many" ? "checkbox" : "radio", name: q.id, value });
  const row = [el("label", { class: "option" }, input, el("span", {}, value === OTHER ? "Other (please say)" : value))];
  if (value === OTHER) {
    const t = el("input", { type: "text", class: "other-text", name: q.id + "_other", hidden: true, "aria-label": q.id + " other, please say", maxLength: 200 });
    row.push(t);
  }
  return row;
}

function buildDetails(q) {
  const box = el("div", { class: "details", hidden: true });
  box.append(el("p", { class: "details-note" }, q.details.note));
  q.details.fields.forEach(f => {
    const id = "detail-" + f.name;
    const label = el("label", { class: "details-label", htmlFor: id }, f.label);
    if (f.required) label.append(el("span", { class: "req" }, "Required"));
    const input = el("input", { type: "text", id, name: f.name, maxLength: 200, autocomplete: f.autocomplete || "off", "aria-describedby": id + "-error" });
    box.append(el("div", { class: "details-field" }, label, input, el("p", { class: "error", id: id + "-error", hidden: true })));
  });
  return box;
}

function updateDetails(q, fs) {
  const box = fs.querySelector(".details");
  const on = selected(q)[0] === q.details.showOn;
  box.hidden = !on;
  if (!on) {
    box.querySelectorAll("input").forEach(i => { i.value = ""; i.removeAttribute("aria-invalid"); });
    box.querySelectorAll(".error").forEach(e => { e.hidden = true; e.textContent = ""; });
  }
}

function buildQuestion(q) {
  const fs = el("fieldset", { id: "fs-" + q.id });
  const legend = el("legend", {}, el("span", { class: "qnum" }, q.id.slice(1) + "."), q.text);
  if (q.required) legend.append(el("span", { class: "req" }, "Required"));
  fs.append(legend);
  if (q.hint) fs.append(el("p", { class: "hint" }, q.hint));
  if (q.type === "one" || q.type === "many") {
    q.options.forEach(o => fs.append(...optionRow(q, o, q.type)));
    if (q.details) fs.append(buildDetails(q));
    fs.addEventListener("change", () => {
      if (q.details) updateDetails(q, fs);
      const other = fs.querySelector(".other-text");
      if (other) {
        const box = fs.querySelector(`input[value="${OTHER}"]`);
        other.hidden = !box.checked;
        if (other.hidden) other.value = "";
      }
      if (q.max) {
        const boxes = [...fs.querySelectorAll("input[type=checkbox]")];
        const full = boxes.filter(b => b.checked).length >= q.max;
        boxes.forEach(b => { if (!b.checked) b.disabled = full; });
      }
    });
  } else if (q.type === "grid") {
    q.rows.forEach((r, i) => {
      const name = `${q.id}_${i}`;
      const labelId = name + "_label";
      const pills = el("div", { class: "pills", role: "radiogroup", "aria-labelledby": labelId, style: `--n:${q.columns.length}` },
        q.columns.map(c => el("label", { class: "pill" },
          el("input", { type: "radio", name, value: c }), el("span", {}, c))));
      fs.append(el("div", { class: "grid-row" }, el("span", { class: "row-label", id: labelId }, r), pills));
    });
  } else {
    fs.append(el("textarea", { name: q.id, "aria-label": q.text, maxLength: 3000 }));
  }
  fs.append(el("p", { class: "error", hidden: true }));
  return fs;
}

function buildForm() {
  SECTIONS.forEach((s, i) => {
    const sec = el("section", { class: "page", hidden: i !== 0 });
    const card = el("div", { class: "card" }, el("h2", { tabIndex: -1 }, s.title));
    if (s.note) card.append(el("p", { class: "hint" }, s.note));
    if (s.intro) card.append(introBlock());
    s.questions.forEach(q => card.append(buildQuestion(q)));
    sec.append(card);
    form.append(sec);
  });
  form.append(el("input", { type: "text", name: "_gotcha", class: "trap", tabIndex: -1, autocomplete: "off", "aria-hidden": "true" }));
  form.append(el("p", { class: "error", id: "submit-error", hidden: true, role: "alert" }));
  const back = el("button", { type: "button", class: "secondary", id: "back" }, "Back");
  const next = el("button", { type: "submit", id: "next" }, "Next");
  form.append(el("div", { class: "nav" }, back, next));
  back.addEventListener("click", () => show(page - 1));
}

function show(i) {
  page = i;
  const pages = form.querySelectorAll(".page");
  pages.forEach((p, n) => { p.hidden = n !== i; });
  document.getElementById("back").style.visibility = i === 0 ? "hidden" : "visible";
  document.getElementById("next").textContent = i === pages.length - 1 ? "Submit" : "Next";
  progress.innerHTML = "";
  progress.append(`Step ${i + 1} of ${pages.length}`,
    el("div", { class: "bar" }, el("span", { style: `width:${Math.round((i + 1) / pages.length * 100)}%` })));
  document.getElementById("submit-error").hidden = true;
  window.scrollTo(0, 0);
  const h = pages[i].querySelector("h2");
  if (h) h.focus({ preventScroll: true });
}

function selected(q) {
  return [...form.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x => x.value);
}

function validate(sec) {
  let firstBad = null;
  let firstBadInput = null;
  sec.questions.forEach(q => {
    const fs = document.getElementById("fs-" + q.id);
    const err = fs.querySelector(":scope > .error");
    const bad = q.required && selected(q).length === 0;
    err.hidden = !bad;
    err.textContent = bad ? "Please answer this question to continue." : "";
    if (bad && !firstBad) firstBad = fs;
    if (q.details) {
      const box = fs.querySelector(".details");
      q.details.fields.forEach(f => {
        const input = box.querySelector(`[name="${f.name}"]`);
        const fieldErr = document.getElementById(input.id + "-error");
        const missing = !box.hidden && f.required && input.value.trim() === "";
        input.setAttribute("aria-invalid", missing ? "true" : "false");
        fieldErr.hidden = !missing;
        fieldErr.textContent = missing ? f.error : "";
        if (missing && !firstBad) { firstBad = input; firstBadInput = input; }
      });
    }
  });
  if (firstBad) firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
  if (firstBadInput) firstBadInput.focus({ preventScroll: true });
  return !firstBad;
}

function collect() {
  const out = {};
  SECTIONS.forEach(s => s.questions.forEach(q => {
    if (q.type === "grid") {
      q.rows.forEach((r, i) => {
        const c = form.querySelector(`input[name="${q.id}_${i}"]:checked`);
        out[`${q.id} ${r}`] = c ? c.value : "";
      });
    } else if (q.type === "text") {
      out[`${q.id} ${q.text}`] = form.querySelector(`[name="${q.id}"]`).value.trim();
    } else {
      const vals = selected(q).map(v => {
        if (v !== OTHER) return v;
        const t = form.querySelector(`[name="${q.id}_other"]`).value.trim();
        return t ? `Other: ${t}` : OTHER;
      });
      out[`${q.id} ${q.text}`] = vals.join("; ");
      if (q.details) {
        q.details.fields.forEach(f => {
          const input = form.querySelector(`[name="${f.name}"]`);
          out[`${f.name} ${f.label}`] = input.closest(".details").hidden ? "" : input.value.trim();
        });
      }
    }
  }));
  const trap = form.querySelector('[name="_gotcha"]').value;
  if (trap) out._gotcha = trap;
  return out;
}

function finish(title, message, withContact) {
  form.hidden = true;
  progress.hidden = true;
  endBox.hidden = false;
  endBox.innerHTML = "";
  endBox.append(el("h2", {}, title), el("p", {}, message));
  if (withContact) endBox.append(contactLine());
  endBox.focus();
  window.scrollTo(0, 0);
}

async function submit() {
  const err = document.getElementById("submit-error");
  const btn = document.getElementById("next");
  err.hidden = true;
  if (!CONFIG.formEndpoint) {
    err.textContent = "This survey isn't accepting responses yet. Your answers have not been sent.";
    err.hidden = false;
    return;
  }
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const res = await fetch(CONFIG.formEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(collect())
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const wantsInterview = selected({ id: "Q29" })[0] === "Yes";
    finish("Thank you", wantsInterview
      ? "Your answers and details have been sent. I'll be in touch to arrange the interview."
      : "Your answers have been sent. They are a real help to this research.", wantsInterview);
  } catch (e) {
    err.textContent = "Your answers couldn't be sent. Please check your connection and try again.";
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = "Submit";
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  const sec = SECTIONS[page];
  if (!validate(sec)) return;
  const ended = sec.questions.find(q => q.endOn && selected(q)[0] === q.endOn);
  if (ended) {
    finish("Thank you", ended.id === "Q1"
      ? "No problem. You haven't taken part and no answers were saved. You can close this page."
      : "This survey is for people who handle media files, so there's nothing more to answer. No answers were saved. You can close this page.");
    return;
  }
  if (page === SECTIONS.length - 1) submit();
  else show(page + 1);
});

(function setup() {
  const missing = [];
  if (!CONFIG.researcherName) missing.push("your name");
  if (!CONFIG.researcherEmail) missing.push("your email");
  if (!CONFIG.formEndpoint) missing.push("a form endpoint to receive answers");
  if (missing.length) {
    const box = document.getElementById("setup");
    box.hidden = false;
    box.textContent = "Setup needed before sharing: add " + missing.join(", ") + " in the CONFIG section at the top of this file.";
  }
  buildForm();
  show(0);
})();
</script>
